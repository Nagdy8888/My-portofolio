<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reel GraphRAG movie assistant system overview</title>
  <desc id="desc">A Next.js frontend on Vercel connects through Caddy to FastAPI and an in-process LangGraph agent on AWS, using Supabase, LightRAG PostgreSQL, OpenAI, LangSmith, and TMDB.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="#09090b"/>
  <text x="80" y="82" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">Reel  GraphRAG Movie Assistant</text>
  <text x="80" y="126" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="20">Grounded recommendations, stable citations, streaming answers, and an interactive knowledge graph</text>

  <rect x="70" y="190" width="310" height="530" rx="22" fill="#18181b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="225" y="240" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">VERCEL</text>
  <rect x="105" y="285" width="240" height="125" rx="16" fill="#27272a" stroke="#52525b"/>
  <text x="225" y="335" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="22">Next.js 16</text>
  <text x="225" y="370" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="17">login · chat · history</text>
  <text x="225" y="397" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="17">sources · Sigma graph</text>
  <rect x="105" y="485" width="240" height="105" rx="16" fill="#27272a" stroke="#52525b"/>
  <text x="225" y="530" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="21">Browser Session</text>
  <text x="225" y="562" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="17">Supabase JWT</text>

  <rect x="470" y="190" width="510" height="530" rx="22" fill="#18181b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="725" y="240" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">AWS EC2</text>
  <rect x="510" y="280" width="180" height="95" rx="14" fill="#27272a" stroke="#52525b"/>
  <text x="600" y="335" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="21">Caddy HTTPS</text>
  <rect x="750" y="280" width="190" height="95" rx="14" fill="#27272a" stroke="#52525b"/>
  <text x="845" y="320" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="21">FastAPI</text>
  <text x="845" y="350" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="16">REST · SSE · auth</text>
  <rect x="510" y="450" width="210" height="115" rx="14" fill="#2e1065" stroke="#a78bfa"/>
  <text x="615" y="495" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="21">LangGraph Agent</text>
  <text x="615" y="527" text-anchor="middle" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="16">route · retrieve · generate</text>
