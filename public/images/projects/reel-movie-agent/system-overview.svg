  <text x="855" y="527" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="16">AGE · pgvector</text>

  <rect x="1070" y="190" width="460" height="530" rx="22" fill="#18181b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1300" y="240" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">CLOUD SERVICES</text>
  <rect x="1110" y="285" width="170" height="100" rx="14" fill="#052e16" stroke="#4ade80"/>
