  <text x="1405" y="355" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="16">LLMs + embeddings</text>
  <rect x="1110" y="455" width="170" height="100" rx="14" fill="#27272a" stroke="#71717a"/>
  <text x="1195" y="495" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="20">LangSmith</text>
  <text x="1195" y="525" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="16">agent traces</text>
  <rect x="1320" y="455" width="170" height="100" rx="14" fill="#27272a" stroke="#71717a"/>
  <text x="1405" y="495" text-anchor="middle" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="20">TMDB + CMU</text>
  <text x="1405" y="525" text-anchor="middle" fill="#d4d4d8" font-family="Inter,Arial,sans-serif" font-size="16">posters + source data</text>

  <g fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)">
    <path d="M380 340 H510"/>
